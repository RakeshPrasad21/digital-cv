career-profile:
    title: Career Profile
    summary: |
      Technical Architect and Microsoft-certified technology professional with 12+ years of experience 
      designing and delivering enterprise cloud, cybersecurity, Microsoft 365, and data-driven solutions 
      across Azure and GCP environments. Experienced in leading technical teams, translating business 
      requirements into practical technology solutions, and driving cloud transformation, security 
      modernization, governance, and operational improvement initiatives.
        - Technical Architecture and solution design across Azure and GCP cloud environments.
        - Microsoft Security: Microsoft Sentinel, Defender, Security Exposure Management, and security operations.
        - Microsoft Purview, Information Protection, DLP, governance, and compliance solutions.
        - Cloud security assessments, Zero Trust, IAM, security monitoring, and remediation planning.
        - Azure/GCP architecture assessment, cloud governance, operational maturity, and FinOps.
        - Power BI dashboards, security analytics, cloud cost optimization, and executive reporting.
        - AI governance, AI cost optimization, Copilot/MCP solutions, and AI-enabled enterprise use cases.
        - Technical leadership, solution reviews, documentation, architecture governance, and team mentoring.
